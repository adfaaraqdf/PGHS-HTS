name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate official seed catalog
        run: npm run seed:validate

      - name: Production build
        run: npm run build

  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: local-ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: local-ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies including Supabase CLI
        run: npm ci

      - name: Start isolated Supabase local stack
        run: npm run supabase:start

      - name: Reset database and apply migrations and seed
        run: npm run db:reset

      - name: Lint local database
        run: npm run db:lint

      - name: Run pgTAP database tests
        run: npm run test:db

      - name: Stop Supabase local stack
        if: always()
        run: npm run supabase:stop
